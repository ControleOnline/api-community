# Single deploy pipeline for dev / staging / master.
# Step 1 (configure) resolves environment variables from the branch.
# Step 2 (deploy) consumes those outputs — one process, no per-env copies.
# LaveGo whitelabel remains separate (workflow_dispatch / branch xxx only).
name: Deploy

on:
  push:
    branches: [dev, staging, master]
  workflow_dispatch:
    inputs:
      target:
        description: "Environment to deploy"
        required: true
        type: choice
        options: [dev, staging, master]

concurrency:
  group: deploy-${{ github.event.inputs.target || github.ref_name }}
  cancel-in-progress: false

jobs:
  # ─── Step 1: resolve environment ───────────────────────────────────────────
  configure:
    name: "1 · Configure environment"
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.set.outputs.env }}
      branch: ${{ steps.set.outputs.branch }}
      remote_path: ${{ steps.set.outputs.remote_path }}
      messenger_domain: ${{ steps.set.outputs.messenger_domain }}
      auth_mode: ${{ steps.set.outputs.auth_mode }}
      bootstrap: ${{ steps.set.outputs.bootstrap }}
      github_environment: ${{ steps.set.outputs.github_environment }}
    steps:
      - name: Map branch → environment config
        id: set
        run: |
          set -e
          REF="${{ github.event.inputs.target || github.ref_name }}"
          case "$REF" in
            dev)
              ENV=dev; BRANCH=dev
              REMOTE_PATH=/var/www/api-community-dev
              MESSENGER_DOMAIN=d.controleonline.com
              AUTH_MODE=password; BOOTSTRAP=true; GH_ENV=dev
              ;;
            staging)
              ENV=staging; BRANCH=staging
              REMOTE_PATH=/var/www/api-community
              MESSENGER_DOMAIN=s.controleonline.com
              AUTH_MODE=password; BOOTSTRAP=false; GH_ENV=staging
              ;;
            master)
              ENV=master; BRANCH=master
              REMOTE_PATH='~/sistemas/controleonline/api'
              MESSENGER_DOMAIN=api.controleonline.com
              AUTH_MODE=key; BOOTSTRAP=false; GH_ENV=production
              ;;
            *)
              echo "Unsupported target: $REF (expected dev|staging|master)"
              exit 1
              ;;
          esac
          {
            echo "env=$ENV"
            echo "branch=$BRANCH"
            echo "remote_path=$REMOTE_PATH"
            echo "messenger_domain=$MESSENGER_DOMAIN"
            echo "auth_mode=$AUTH_MODE"
            echo "bootstrap=$BOOTSTRAP"
            echo "github_environment=$GH_ENV"
          } >> "$GITHUB_OUTPUT"
          echo "Configured: env=$ENV branch=$BRANCH path=$REMOTE_PATH auth=$AUTH_MODE"

  # ─── Step 2: deploy ────────────────────────────────────────────────────────
  deploy:
    name: "2 · Deploy (${{ needs.configure.outputs.env }})"
    needs: configure
    runs-on: ubuntu-latest
    environment: ${{ needs.configure.outputs.github_environment }}
    steps:
      - uses: actions/checkout@v5

      - name: Validate required secrets for environment
        run: |
          set -e
          ENV="${{ needs.configure.outputs.env }}"
          case "$ENV" in
            dev)
              test -n "${{ secrets.DEV_HOST }}" || { echo "Missing DEV_HOST"; exit 1; }
              test -n "${{ secrets.DEV_USER }}" || { echo "Missing DEV_USER"; exit 1; }
              test -n "${{ secrets.DEV_PASS }}" || { echo "Missing DEV_PASS"; exit 1; }
              ;;
            staging)
              test -n "${{ secrets.STAGING_HOST }}" || { echo "Missing STAGING_HOST"; exit 1; }
              test -n "${{ secrets.STAGING_USER }}" || { echo "Missing STAGING_USER"; exit 1; }
              test -n "${{ secrets.STAGING_PASS }}" || { echo "Missing STAGING_PASS"; exit 1; }
              ;;
            master)
              test -n "${{ secrets.API_HOST }}" || { echo "Missing API_HOST"; exit 1; }
              test -n "${{ secrets.USER }}" || { echo "Missing USER"; exit 1; }
              test -n "${{ secrets.CONTROLEONLINE }}" || { echo "Missing CONTROLEONLINE (SSH key)"; exit 1; }
              ;;
          esac

      - name: Deploy application over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ needs.configure.outputs.env == 'dev' && secrets.DEV_HOST || needs.configure.outputs.env == 'staging' && secrets.STAGING_HOST || secrets.API_HOST }}
          username: ${{ needs.configure.outputs.env == 'dev' && secrets.DEV_USER || needs.configure.outputs.env == 'staging' && secrets.STAGING_USER || secrets.USER }}
          password: ${{ needs.configure.outputs.auth_mode == 'password' && (needs.configure.outputs.env == 'dev' && secrets.DEV_PASS || secrets.STAGING_PASS) || '' }}
          key: ${{ needs.configure.outputs.auth_mode == 'key' && secrets.CONTROLEONLINE || '' }}
          port: ${{ needs.configure.outputs.auth_mode == 'key' && secrets.PORT || 22 }}
          # set -e in the script provides fail-fast behavior. script_stop
          # rewrites every input line and breaks shell functions/loops.
          script_stop: false
          envs: DEPLOY_BRANCH,REMOTE_PATH,MESSENGER_DOMAIN,BOOTSTRAP
          script: |
            set -e
            export PATH="/usr/local/bin:/usr/bin:/bin:$PATH"
            export COMPOSER_ALLOW_SUPERUSER=1

            BRANCH="${DEPLOY_BRANCH}"
            TARGET="${REMOTE_PATH}"
            TARGET="${TARGET/#\~/$HOME}"

            if [ "${BOOTSTRAP}" = "true" ] && [ ! -d "$TARGET/.git" ]; then
              echo "Bootstrap: cloning api-community@${BRANCH} into $TARGET"
              mkdir -p "$(dirname "$TARGET")"
              git clone --branch "$BRANCH" --recurse-submodules https://github.com/ControleOnline/api-community.git "$TARGET"
            fi

            cd "$TARGET"
            RESTART_FILE="$PWD/public/.lsphp_restart.txt"

            # Fetch only the deployment ref. Fetching every remote branch with
            # recurseSubmodules enabled can chase orphaned gitlinks unrelated
            # to staging (observed with financial during recovery attempt 1).
            git -c fetch.recurseSubmodules=false fetch origin \
              "+refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}"
            if git show-ref --verify --quiet "refs/heads/${BRANCH}"; then
              git checkout "$BRANCH"
            else
              git checkout -B "$BRANCH" "origin/${BRANCH}"
            fi
            git reset --hard "origin/${BRANCH}"
            git clean -ffd

            # api-community#78 recovery: preserve the two known dirty module
            # worktrees before cleaning them.  composer.json installs
            # controleonline/* into these same paths, so prior composer runs
            # can overwrite the submodule checkouts.
            EVIDENCE_ROOT="$HOME/deploy-evidence/api-community-78"
            EVIDENCE_DIR="$EVIDENCE_ROOT/$(date -u +%Y%m%dT%H%M%SZ)"
            umask 077
            mkdir -p "$EVIDENCE_DIR"

            audit_module() {
              module="$1"
              slug="${module##*/}"
              repo="$TARGET/$module"
              mkdir -p "$EVIDENCE_DIR/$slug"

              git -C "$repo" status --porcelain=v2 --untracked-files=all > "$EVIDENCE_DIR/$slug/status.porcelain-v2"
              git -C "$repo" diff --binary > "$EVIDENCE_DIR/$slug/worktree.patch"
              git -C "$repo" diff --cached --binary > "$EVIDENCE_DIR/$slug/index.patch"
              git -C "$repo" ls-files --others --exclude-standard -z > "$EVIDENCE_DIR/$slug/untracked.zlist"
              if [ -s "$EVIDENCE_DIR/$slug/untracked.zlist" ]; then
                tar -C "$repo" --null -T "$EVIDENCE_DIR/$slug/untracked.zlist" -czf "$EVIDENCE_DIR/$slug/untracked.tar.gz"
              fi

              {
                echo "module=$module"
                echo "head=$(git -C "$repo" rev-parse HEAD)"
                echo "expected=$(git -C "$TARGET" ls-tree HEAD "$module" | awk '{print $3}')"
                for path in \
                  src/Entity/PeopleLink.php \
                  src/Service/PeopleRoleService.php \
                  src/State/PeopleLinkUpsertProcessor.php \
                  src/Controller/Oauth/Discord/DiscordConnectController.php
                do
                  [ -f "$repo/$path" ] || continue
                  blob=$(git -C "$repo" hash-object "$path")
                  echo "file=$path blob=$blob sha256=$(sha256sum "$repo/$path" | awk '{print $1}')"
                  git -C "$repo" log --all --format=%H -- "$path" | while read -r commit; do
                    candidate=$(git -C "$repo" rev-parse "$commit:$path" 2>/dev/null || true)
                    if [ "$candidate" = "$blob" ]; then
                      git -C "$repo" show -s --format='match=%H author_date=%aI subject=%s' "$commit"
                    fi
                  done
                done
              } > "$EVIDENCE_DIR/$slug/origin-analysis.txt"

              # Fail closed: remove only the paths named in run 32736920319,
              # and only when their exact blob already exists in Git history.
              git -C "$repo" status --porcelain --untracked-files=all > "$EVIDENCE_DIR/$slug/status.short"
              cut -c4- "$EVIDENCE_DIR/$slug/status.short" | while IFS= read -r path; do
                [ -n "$path" ] || continue
                case "$slug:$path" in
                  people:src/Entity/PeopleLink.php|people:src/Service/PeopleRoleService.php|people:src/State/PeopleLinkUpsertProcessor.php|users:src/Controller/Oauth/Discord/DiscordConnectController.php)
                    ;;
                  *)
                    echo "Refusing cleanup of unexpected path: $module/$path"
                    exit 1
                    ;;
                esac

                blob=$(git -C "$repo" hash-object "$path")
                matched=false
                for commit in $(git -C "$repo" log --all --format=%H -- "$path"); do
                  candidate=$(git -C "$repo" rev-parse "$commit:$path" 2>/dev/null || true)
                  if [ "$candidate" = "$blob" ]; then
                    matched=true
                    break
                  fi
                done
                if [ "$matched" != true ]; then
                  echo "Refusing cleanup of unmatched blob: $module/$path $blob"
                  exit 1
                fi
              done

              sha256sum "$EVIDENCE_DIR/$slug"/* > "$EVIDENCE_DIR/$slug/SHA256SUMS"
            }

            audit_module modules/controleonline/people
            audit_module modules/controleonline/users
            echo "Evidence preserved: $EVIDENCE_DIR"
            sed -n '/^module=/p;/^head=/p;/^expected=/p;/^file=/p;/^match=/p' "$EVIDENCE_DIR/people/origin-analysis.txt" "$EVIDENCE_DIR/users/origin-analysis.txt"

            # Evidence remains private, but release files must be traversable
            # by the PHP runtime user.
            umask 022
            git -C modules/controleonline/people reset --hard
            git -C modules/controleonline/people clean -ffd
            git -C modules/controleonline/users reset --hard
            git -C modules/controleonline/users clean -ffd

            git submodule sync --recursive
            git submodule update --recursive --init --force
            chmod -R a+rX modules/controleonline

            # Parent gitlinks are authoritative. Never replace them with each
            # submodule's branch tip during a release deployment.
            if git submodule status --recursive | grep -Eq '^[+-U]'; then
              echo "Submodule checkout does not match the parent gitlinks"
              git submodule status --recursive
              exit 1
            fi

            # Safe recovery scope: 88b6662..4768929 changes only the people
            # gitlink. Composer would overwrite pinned modules (installer-paths),
            # and migrations are not authorized for this staging recovery.
            echo "Composer skipped: dependency manifests unchanged in recovery delta"
            echo "Database migrations skipped: not authorized for api-community#78 recovery"
            rm -rf var/cache/prod/pools/system
            rm -rf var/cache/prod/doctrine/orm
            rm -f var/cache/prod/serialization.php
            php -d opcache.enable_cli=0 bin/console about --env=prod --no-debug >/dev/null
            mkdir -p var/log
            touch "$HOME/.lsphp_restart.txt" 2>/dev/null || true
            touch "$RESTART_FILE" 2>/dev/null || true
            if command -v systemctl >/dev/null 2>&1; then
              sudo -n systemctl reload php8.3-fpm 2>/dev/null || sudo -n service php8.3-fpm reload 2>/dev/null || true
            fi
            rm -f "$HOME/.lsphp_restart.txt" "$RESTART_FILE" 2>/dev/null || true
            echo "Deploy OK: $(git rev-parse HEAD) @ ${BRANCH} → ${TARGET}"
            echo "websocket-server pin: $(git ls-tree HEAD modules/controleonline/websocket-server | awk '{print $3}')"
            echo "people pin: $(git ls-tree HEAD modules/controleonline/people | awk '{print $3}')"
        env:
          DEPLOY_BRANCH: ${{ needs.configure.outputs.branch }}
          REMOTE_PATH: ${{ needs.configure.outputs.remote_path }}
          MESSENGER_DOMAIN: ${{ needs.configure.outputs.messenger_domain }}
          BOOTSTRAP: ${{ needs.configure.outputs.bootstrap }}

  # ─── Step 3: recovery verification ──────────────────────────────────────────
  tests:
    name: "3 · Verify api-community#78 recovery"
    needs: [configure, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.configure.outputs.branch }}
          submodules: recursive
      - name: Verify immutable release inputs
        run: |
          set -e
          test "$(git rev-parse HEAD)" = "4768929ea80fd57f2ad6e6b9441c7af53b0c098a"
          test "$(git ls-tree HEAD modules/controleonline/websocket-server | awk '{print $3}')" = "a6d95fcfd7c8ee525c14c0da800c8a0a48c421b1"
          test "$(git -C modules/controleonline/websocket-server rev-parse HEAD)" = "a6d95fcfd7c8ee525c14c0da800c8a0a48c421b1"
      - name: Verify public staging health
        run: |
          set -e
          for url in \
            https://s.controleonline.com/people/company/default \
            https://s.controleonline.com/themes-colors.css
          do
            status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --retry 3 --retry-all-errors "$url")
            test "$status" = "200" || { echo "Unhealthy: $status $url"; exit 1; }
            echo "Healthy: $status $url"
          done
