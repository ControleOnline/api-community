name: Fix Jaguncos Shop Tenants
on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Register shop tenants on production master
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.API_HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.CONTROLEONLINE }}
          port: ${{ secrets.PORT }}
          script: |
            cd ~/sistemas/controleonline/api
            php <<'PHP'
            <?php
            function readEnvValue(string $key): ?string
            {
                foreach (['.env.local', '.env'] as $file) {
                    if (!is_file($file)) {
                        continue;
                    }

                    foreach (file($file, FILE_IGNORE_NEW_LINES | FILE_SKIP_EMPTY_LINES) as $line) {
                        $line = trim($line);
                        if ($line === '' || str_starts_with($line, '#') || !str_contains($line, '=')) {
                            continue;
                        }

                        [$name, $value] = explode('=', $line, 2);
                        if (trim($name) !== $key) {
                            continue;
                        }

                        return trim($value, " \t\n\r\0\x0B\"'");
                    }
                }

                $value = getenv($key);
                return $value === false ? null : $value;
            }

            $required = ['DATABASE_HOST', 'DATABASE_PORT', 'DATABASE_NAME', 'DATABASE_USER', 'DATABASE_PASSWORD', 'TENANCY_SECRET'];
            $env = [];
            foreach ($required as $key) {
                $env[$key] = readEnvValue($key);
                if ($env[$key] === null || $env[$key] === '') {
                    throw new RuntimeException($key . ' is not configured.');
                }
            }

            $pdo = new PDO(
                sprintf('mysql:host=%s;port=%d;dbname=%s;charset=utf8mb4', $env['DATABASE_HOST'], (int) $env['DATABASE_PORT'], $env['DATABASE_NAME']),
                $env['DATABASE_USER'],
                $env['DATABASE_PASSWORD'],
                [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION, PDO::ATTR_DEFAULT_FETCH_MODE => PDO::FETCH_ASSOC]
            );

            $hasInstallStatus = (int) $pdo->query("SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA = DATABASE() AND TABLE_NAME = 'databases' AND COLUMN_NAME = 'instalation_status'")->fetchColumn() > 0;
            if (!$hasInstallStatus) {
                $pdo->exec('ALTER TABLE `databases` ADD `instalation_status` ENUM("pending", "installing", "installed", "failed") NOT NULL DEFAULT "pending" AFTER `db_password`');
                $pdo->exec('UPDATE `databases` SET `instalation_status` = "installed" WHERE `instalation_status` = "pending"');
            }

            $referenceDomain = 'erp.jaguncos.com.br';
            $domains = ['loja.jaguncos.com.br', 'cardapio.jaguncos.com.br'];
            $reference = $pdo->prepare('SELECT id FROM `databases` WHERE app_host = ? LIMIT 1');
            $reference->execute([$referenceDomain]);
            if (!$reference->fetchColumn()) {
                throw new RuntimeException('Reference tenant not found: ' . $referenceDomain);
            }

            foreach ($domains as $domain) {
                $insert = $pdo->prepare(
                    'INSERT INTO `databases` (`app_host`, `db_host`, `db_name`, `db_port`, `db_user`, `db_password`, `db_driver`, `db_instance`, `instalation_status`)
                     SELECT ?, `db_host`, `db_name`, `db_port`, `db_user`, `db_password`, `db_driver`, `db_instance`, "installed"
                     FROM `databases`
                     WHERE `app_host` = ?
                       AND NOT EXISTS (SELECT 1 FROM (SELECT id FROM `databases` WHERE `app_host` = ?) existing)'
                );
                $insert->execute([$domain, $referenceDomain, $domain]);

                $update = $pdo->prepare(
                    'UPDATE `databases` target
                     JOIN `databases` source ON source.`app_host` = ?
                     SET target.`db_host` = source.`db_host`,
                         target.`db_name` = source.`db_name`,
                         target.`db_port` = source.`db_port`,
                         target.`db_user` = source.`db_user`,
                         target.`db_password` = source.`db_password`,
                         target.`db_driver` = source.`db_driver`,
                         target.`db_instance` = source.`db_instance`,
                         target.`instalation_status` = "installed"
                     WHERE target.`app_host` = ?'
                );
                $update->execute([$referenceDomain, $domain]);
            }

            $stmt = $pdo->prepare('SELECT app_host, db_host, db_name, db_user, db_driver, db_port, db_instance, instalation_status, AES_DECRYPT(db_password, ?) IS NOT NULL AS password_ok FROM `databases` WHERE app_host IN (?, ?, ?) ORDER BY app_host');
            $stmt->execute([$env['TENANCY_SECRET'], $referenceDomain, ...$domains]);
            echo json_encode($stmt->fetchAll(), JSON_PRETTY_PRINT | JSON_UNESCAPED_UNICODE) . PHP_EOL;
            PHP
