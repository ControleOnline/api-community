name: Deploy reviewed API Lave-Go
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reviewed-apinew-lavego
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Publish exact reviewed snapshot to apinew only
        uses: appleboy/ssh-action@v1.2.2
        env:
          REVIEWED_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.HOST_APINEW_LAVEGO }}
          username: ${{ secrets.USER_APINEW_LAVEGO }}
          password: ${{ secrets.PASS_APINEW_LAVEGO }}
          port: ${{ secrets.PORT_APINEW_LAVEGO }}
          envs: REVIEWED_SHA
          command_timeout: 20m
          script: |
            set -eu
            cd "$HOME/api"
            PHP_BIN="$(command -v ea-php85 || true)"
            if [ -z "$PHP_BIN" ]; then PHP_BIN=/opt/cpanel/ea-php85/root/usr/bin/php; fi
            test -x "$PHP_BIN"
            COMPOSER_BIN="$(command -v composer)"
            PREVIOUS_SHA="$(git rev-parse HEAD)"
            echo "Previous application SHA: $PREVIOUS_SHA"
            git fetch origin
            git cat-file -e "$REVIEWED_SHA^{commit}"
            # No master publication, git clean, schema or business-data migration.
            git checkout --detach "$REVIEWED_SHA"
            "$PHP_BIN" "$COMPOSER_BIN" update controleonline/orders --with-dependencies --no-interaction --no-scripts --no-progress
            "$PHP_BIN" -r '$l=json_decode(file_get_contents("composer.lock"),true); foreach($l["packages"] as $p) { if($p["name"]==="controleonline/orders") { if(ltrim($p["version"],"v")!=="1.0.8") { exit(1); } echo "Orders package: ".$p["version"].PHP_EOL; } }'
            rm -rf var/cache/prod
            "$PHP_BIN" bin/console cache:warmup --env=prod --no-debug
            "$PHP_BIN" bin/console about --env=prod --no-debug
            touch "$HOME/.lsphp_restart.txt"
            echo "Published reviewed Lave-Go API SHA: $(git rev-parse HEAD)"
