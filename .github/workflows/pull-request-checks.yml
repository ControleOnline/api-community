name: Pull Request Checks

on:
  workflow_call:
    inputs:
      ref:
        description: "Revision to validate before deployment"
        required: true
        type: string
    outputs:
      sha:
        description: "Exact commit that passed backend validation"
        value: ${{ jobs.baseline-checks.outputs.sha }}
      lock_sha256:
        description: "SHA-256 of the dependency lock produced by passing checks"
        value: ${{ jobs.baseline-checks.outputs.lock_sha256 }}
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: pull-request-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
      lock_sha256: ${{ steps.lock.outputs.sha256 }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Resolve checked revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Validate composer manifest
        # Exact first-party versions freeze the reviewed package composition.
        run: composer validate --no-check-all --no-check-publish --strict

      - name: Check PHP syntax
        run: find src tests bin config -type f \( -name '*.php' -o -name '*.phtml' \) -print0 | xargs -0 -r -n1 php -l

      - name: Install reviewed backend packages
        run: composer install --no-interaction --no-progress --prefer-dist --no-scripts

      - name: Verify application container boot
        env:
          APP_ENV: test
        run: php bin/console about --no-debug

      - name: Verify waiter consumer contracts
        run: composer test:waiter

      - name: Verify complete backend suite
        run: composer test:backend

      - name: Check diff hygiene
        run: git diff --check

      - name: Record validated dependency lock
        id: lock
        run: echo "sha256=$(sha256sum composer.lock | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Upload validated dependency lock
        uses: actions/upload-artifact@v4
        with:
          name: composer-lock-${{ github.run_id }}-${{ github.run_attempt }}
          path: composer.lock
          if-no-files-found: error
          retention-days: 1
