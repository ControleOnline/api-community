name: Pull Request Checks

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: pull-request-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Test package release manifest validation
        run: node --test scripts/tests/package-release-manifest.test.mjs

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Validate composer manifest
        run: composer validate --no-check-publish

      - name: Validate stable Composer package pins
        run: php scripts/validate-composer-release-pins.php

      - name: Verify production package resolution
        run: |
          composer install --no-dev --no-scripts --no-interaction --no-progress
          php scripts/assert-composer-module-resolution.php production

      - name: Verify development package resolution
        env:
          APP_ENV: dev
        run: |
          composer install --no-scripts --no-interaction --no-progress
          php scripts/sync-composer-modules.php
          vendor/bin/phpunit tests/FixAutoloadDeleteDirectoryTest.php
          php -r 'require "vendor/autoload.php"; App\FixAutoload::postInstall();'
          php scripts/assert-composer-module-resolution.php development

      - name: Check PHP syntax
        run: find src tests bin config -type f \( -name '*.php' -o -name '*.phtml' \) -print0 | xargs -0 -r -n1 php -l

      - name: Check diff hygiene
        run: git diff --check
